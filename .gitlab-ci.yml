# Paired with .github/workflows/ci.yml - keep the two in sync when either
# changes (checks run, tool versions, trigger scope).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check

check:skills:
  stage: check
  image: python:3.13-slim
  script:
    - python3 .ci_scripts/validate_skills.py skills
    - python3 .ci_scripts/validate_agents.py agents skills
    - python3 .ci_scripts/validate_doc_links.py .
    - cd .ci_scripts && python3 -m unittest discover -p 'test_*.py'

check:docs:
  stage: check
  image: node:22-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - npm install -g markdownlint-cli2
    - git clone --depth 1 https://github.com/cypher0n3/docs-as-code-tools.git .markdownlint-repo
    - ln -sfn .markdownlint-repo/markdownlint-rules .markdownlint-rules
  script:
    - markdownlint-cli2 '**/*.md'

check:shell:
  stage: check
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck scripts/*.sh claude/*.sh
